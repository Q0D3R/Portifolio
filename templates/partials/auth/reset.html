<!-- Step 3: New Password -->
<form v-if="resetStep === 3" @submit.prevent="resetPassword" class="auth-form">
    <div class="input-group">
        <input :type="showPasswords.resetNew ? 'text' : 'password'" id="new-password" v-model="resetForm.newPassword"
            required>
        <label for="new-password">New Password</label>
        <span class="password-toggle" @click="showPasswords.resetNew = !showPasswords.resetNew">
            <svg v-if="!showPasswords.resetNew" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg v-else xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        </span>
    </div>
    <div class="input-group">
        <input :type="showPasswords.resetConfirm ? 'text' : 'password'" id="password-confirm"
            v-model="resetForm.passwordConfirm" required>
        <label for="password-confirm">Confirm Password</label>
        <span class="password-toggle" @click="showPasswords.resetConfirm = !showPasswords.resetConfirm">
            <svg v-if="!showPasswords.resetConfirm" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg v-else xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        </span>
    </div>
    <button type="submit" class="btn primary-btn">
        <span v-if="!isLoading">Update Password</span>
        <span v-else class="spinner"></span>
    </button>
    <p class="error-msg" v-if="resetError" v-text="resetError"></p>
</form>
